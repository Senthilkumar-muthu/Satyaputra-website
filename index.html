<style>
  :root{
    --gold-hi:#f6dfa0;
    --gold:#c99a3f;
    --gold-lo:#6f4f18;
    --ink:#030b11;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    font-family:'Cinzel', serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ============ HERO ============ */
  .hero{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;
    /* midnight teal-blue with a violet glow low on the horizon, as in the forest reference */
    background:
      radial-gradient(ellipse 75% 6% at 50% 66.5%, rgba(122,72,196,0.30), transparent 75%),
      radial-gradient(ellipse 120% 70% at 50% 62%, #123351 0%, #0b1f2e 38%, #050f16 72%, #02090d 100%);
  }

  /* flash of energy at the very start — the burst of battle, the moment he rides out */
  .flash{
    position:absolute;
    inset:0;
    z-index:5;
    background:radial-gradient(ellipse 60% 50% at 50% 55%, rgba(255,235,190,0.9), rgba(201,154,63,0.3) 40%, transparent 72%);
    opacity:0;
    animation:burst 0.9s ease-out 0.1s forwards;
    pointer-events:none;
  }
  @keyframes burst{
    0%{ opacity:0; }
    18%{ opacity:1; }
    100%{ opacity:0; }
  }

  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 50%;
    opacity:0;
    transform:scale(1.1);
    filter:saturate(1.5) brightness(1.15) contrast(1.08);
    animation:
      imgReveal 1.1s cubic-bezier(.16,.84,.44,1) 0.1s forwards,
      imgCooldown 11s cubic-bezier(.4,0,.2,1) 1s forwards;
    will-change:transform, filter;
  }
  @media (min-aspect-ratio: 4/5){
    .hero img{
      object-fit:contain;
      /* the photo is 2:3 and fills the full height, so it is ~66.6vh wide;
         fade its left/right edges into the black instead of a hard seam */
      -webkit-mask-image:linear-gradient(90deg, transparent calc(50% - 33.3vh), #000 calc(50% - 24vh), #000 calc(50% + 24vh), transparent calc(50% + 33.3vh));
      mask-image:linear-gradient(90deg, transparent calc(50% - 33.3vh), #000 calc(50% - 24vh), #000 calc(50% + 24vh), transparent calc(50% + 33.3vh));
    }
  }
  @keyframes imgReveal{
    to{ opacity:1; transform:scale(1); }
  }
  /* the energy drains out slowly — warmth and vibrance fade to a quiet, cool ache */
  @keyframes imgCooldown{
    to{ filter:saturate(0.75) brightness(0.88) contrast(1); }
  }

  /* soft vertical grade so the title/mark always stay legible,
     independent of where they land on the photo */
  .hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 80% 70% at 50% 52%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.42) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.55) 100%);
    z-index:1;
    pointer-events:none;
  }

  .title{
    position:absolute;
    top:16%;
    left:0; right:0;
    z-index:5;
    text-align:center;
    padding:0 1.2rem;
    opacity:0;
    transform:translateY(14px);
    animation:riseIn 1.3s cubic-bezier(.16,.84,.44,1) 1.6s forwards;
  }

  h1.carved{
    font-family:'Cinzel Decorative', 'Trajan Pro', 'Times New Roman', Georgia, serif;
    font-weight:900;
    font-variant:small-caps;
    font-size:clamp(2.1rem, 9vw, 4.4rem);
    letter-spacing:0.12em;
    line-height:1;
    background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 50%, var(--gold-lo) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:
      0 1px 0 rgba(255,240,200,0.3),
      0 2px 2px rgba(0,0,0,0.6),
      0 6px 18px rgba(0,0,0,0.5);
    position:relative;
    display:inline-block;
  }
  h1.carved::after{
    content:'SATYAPUTRA';
    position:absolute;
    inset:0;
    color:transparent;
    -webkit-text-stroke:1px rgba(0,0,0,0.5);
    z-index:-1;
    transform:translate(1px,2px);
  }

  .mark{
    position:absolute;
    bottom:13.5%;
    left:0; right:0;
    z-index:5;
    text-align:center;
    padding:0 1.2rem;
    opacity:0;
    animation:riseIn 1.6s cubic-bezier(.16,.84,.44,1) 3.4s forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .inscription{
    display:inline-flex;
    align-items:center;
    gap:0.9rem;
    font-family:'Cinzel', 'Times New Roman', Georgia, serif;
    font-size:clamp(0.62rem, 1.9vw, 0.85rem);
    letter-spacing:0.48em;
    text-transform:uppercase;
    background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-lo) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.7));
    animation:emberPulse 5s ease-in-out infinite;
    margin-bottom:1.6rem;
  }
  .inscription::before,
  .inscription::after{
    content:'';
    width:5px;height:5px;
    background:var(--gold);
    transform:rotate(45deg);
    flex-shrink:0;
  }
  @keyframes emberPulse{
    0%,100%{opacity:1;}
    50%{opacity:0.68;}
  }

  /* ============ NOTIFY FORM — the "next action" ============ */
  .notify{
    display:flex;
    justify-content:center;
    gap:0;
    max-width:380px;
    margin:0 auto;
    border:1px solid rgba(201,154,63,0.4);
    background:rgba(3,10,16,0.78);
    backdrop-filter:blur(3px);
  }
  .notify input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    padding:0.85rem 1rem;
    color:var(--gold-hi);
    font-family:'Cinzel', serif;
    font-size:0.78rem;
    letter-spacing:0.04em;
  }
  .notify input::placeholder{
    color:rgba(201,154,63,0.5);
    letter-spacing:0.04em;
  }
  .notify button{
    background:linear-gradient(180deg, var(--gold-hi), var(--gold));
    border:none;
    padding:0 1.3rem;
    color:#231904;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter 0.2s ease;
  }
  .notify button:hover{ filter:brightness(1.12); }
  .notify button:active{ filter:brightness(0.92); }

  .notify-note{
    margin-top:0.7rem;
    font-size:0.6rem;
    letter-spacing:0.08em;
    color:rgba(217,210,191,0.4);
    font-family:'Cinzel', serif;
    text-transform:uppercase;
  }

  /* ============ FALLING PETALS — they drift down, touch the sand, rest, then fade ============ */
  .petals{
    position:absolute;
    inset:0;
    z-index:3;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    animation:softFadeIn 6s ease-in-out 2.4s forwards;
  }
  @keyframes softFadeIn{ to{ opacity:1; } }

  /* three nested layers so the motions can never interfere:
       .petal       falls straight down and lands on the sand
       .petal .sway drifts side to side, then flattens a little as it settles
       .petal .bloom   turns slowly, then stops
     all three share one length and one start time, so they stay in step */
  .petal{
    position:absolute;
    top:0;
    width:var(--w);
    margin-left:calc(var(--w) * -0.5);          /* left% is the petal's centre */
    opacity:0;
    animation:fall var(--fd) linear var(--fl) infinite;
  }
  .petal .sway{
    transform-origin:50% calc((1 - var(--ins, 0)) * 100%);   /* flattens down onto the ground */
    animation:sway var(--fd) ease-in-out var(--fl) infinite;
  }
  .bloom{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    background:url(petals.webp) no-repeat;
    background-size:600% 300%;                                   /* 6 x 3 sheet of rendered flowers */
    background-position:calc(var(--c) * 20%) calc(var(--r) * 50%);
  }
  .petal .bloom{
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.5)) brightness(0.9) blur(var(--blur, 0px));
    animation:spin var(--fd) linear var(--fl) infinite;
  }
  .pl0{ --fd:82s; --amp:1.1rem; --o:0.55; --blur:0.8px; }   /* far  */
  .pl1{ --fd:68s; --amp:1.8rem; --o:0.8; }                  /* mid  */
  .pl2{ --fd:56s; --amp:2.6rem; --o:1; }                    /* near */

  /* --ly is where the sand surface is under this petal (vh); the petal's
     bottom lands there and sinks in a little, like it truly touched down */
  @keyframes fall{
    0%{   transform:translateY(-8vh); opacity:0; animation-timing-function:linear; }
    6%{   opacity:var(--o); }
    76%{  transform:translateY(calc(var(--ly) * 1vh - var(--w) * 0.88 + var(--w) * var(--ins, 0) - 2.2vh)); animation-timing-function:ease-out; }
    82%{  transform:translateY(calc(var(--ly) * 1vh - var(--w) * 0.88 + var(--w) * var(--ins, 0))); }
    94%{  transform:translateY(calc(var(--ly) * 1vh - var(--w) * 0.88 + var(--w) * var(--ins, 0))); opacity:var(--o); }
    100%{ transform:translateY(calc(var(--ly) * 1vh - var(--w) * 0.88 + var(--w) * var(--ins, 0))); opacity:0; }
  }
  @keyframes sway{
    0%{   translate:calc(var(--amp) * -1) 0; scale:1 1; }
    28%{  translate:var(--amp) 0; }
    56%{  translate:calc(var(--amp) * -0.7) 0; }
    76%{  translate:calc(var(--amp) * 0.4) 0; animation-timing-function:ease-out; }
    82%{  translate:calc(var(--amp) * 0.25) 0; scale:1 1; animation-timing-function:ease-out; }
    88%,100%{ translate:calc(var(--amp) * 0.25) 0; scale:1 0.6; }
  }
  @keyframes spin{
    0%{   rotate:0deg; animation-timing-function:linear; }
    77%{  rotate:calc(var(--rtot) * 0.9); animation-timing-function:ease-out; }
    84%,100%{ rotate:var(--rtot); }
  }

  /* ============ HORIZON HAZE — the violet glow low in the dark ============ */
  .haze{
    position:absolute;
    left:-10%; right:-10%;
    top:60%;
    height:26%;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse 60% 100% at 50% 55%, rgba(144,81,203,0.10), rgba(144,81,203,0) 70%);
    mix-blend-mode:screen;
    opacity:0;
    animation:softFadeIn 9s ease-in-out 1.5s forwards;
  }

  /* ============ FIREFLIES — warm lights hovering in the dark ============ */
  .motes{
    position:absolute;
    inset:0;
    z-index:3;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    animation:softFadeIn 8s ease-in-out 3s forwards;
  }
  .mote{
    position:absolute;
    width:var(--s);
    height:var(--s);
    border-radius:50%;
    background:var(--c);
    box-shadow:0 0 calc(var(--s) * 2.6) calc(var(--s) * 0.7) var(--g);
    animation:wander var(--wd) ease-in-out infinite, glow var(--gd) ease-in-out infinite;
    animation-delay:var(--wl), var(--gl);
  }
  .m-y{ --c:#ffe08a; --g:rgba(255,190,60,0.55); }
  .m-o{ --c:#ffa56e; --g:rgba(255,100,40,0.5); }
  .m-v{ --c:#d6bfff; --g:rgba(160,110,255,0.5); }
  /* they hover and wander; they don't travel anywhere */
  @keyframes wander{
    0%,100%{ translate:0 0; }
    25%{ translate:var(--x1) var(--y1); }
    50%{ translate:var(--x2) var(--y2); }
    75%{ translate:var(--x3) var(--y3); }
  }
  @keyframes glow{
    0%,100%{ opacity:0.6; }
    50%{ opacity:1; }
  }

  /* ============ GROUND — natural dunes where the petals come to rest ============ */
  .dune{
    position:absolute;
    left:0; right:0;
    pointer-events:none;
    opacity:0;
    animation:riseIn 2.4s ease-out 1.6s forwards;
  }

  }
  /* the near dune: this is the surface the petals land on */
  .dune-front{
    top:87.0%; height:13.0%;
    z-index:4;
    background:
      url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27160%27 height=%27160%27%3E%3Cfilter id=%27g%27 x=%270%27 y=%270%27 width=%27100%25%27 height=%27100%25%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.85%27 numOctaves=%272%27 seed=%274%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix values=%270 0 0 0 .74  0 0 0 0 .60  0 0 0 0 .44  1.15 0 0 0 -0.70%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url%28%23g%29%27/%3E%3C/svg%3E"),
